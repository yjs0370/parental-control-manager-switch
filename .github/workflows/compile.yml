name: Compile Switch NRO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Install libnx
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          sudo -E dkp-pacman -Sy --noconfirm
          sudo -E dkp-pacman -S --noconfirm switch-libnx switch-sdl2 switch-sdl2_mixer switch-sdl2_ttf switch-sdl2_image switch-curl switch-mbedtls switch-zlib

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          cd $GITHUB_WORKSPACE
          make -j$(nproc)

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: parental-control-manager
          path: |
            parental_control_manager.nro
            parental_control_manager.elf
          if-no-files-found: error
