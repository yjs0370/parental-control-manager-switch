name: Compile Switch NRO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .nro
        run: docker run --rm -v "$PWD:/project" -w /project devkitpro/devkita64 make

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: parental-control-manager
          path: |
            parental_control_manager.nro
            parental_control_manager.elf
          if-no-files-found: error
